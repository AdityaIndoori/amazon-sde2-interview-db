name: Check research database
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.1'
      - name: Test supplemental compiler boundaries
        run: bun run test
      - name: Verify checked-in database
        run: bun run check
      - name: Rebuild from research sources
        run: bun run build
      - name: Verify regenerated database
        run: bun run check
      - name: Require generated artifacts to be current
        run: git diff --exit-code -- data/database.json data/database.csv data/database.sqlite data/unconfirmed.json data/unconfirmed.csv data/unconfirmed.sqlite data/research-ledger.json
